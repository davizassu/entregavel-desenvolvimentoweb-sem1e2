<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Contato</title>
</head>
<body>
    <header>
        <h1>NewsLetter</h1>
        <a href="index.html">Página Inicial</a>
    </header>
        <main>
            <p>Contate-me para receber novidades</p>

<form action="#" class="container-formulario">
    

    <div class="linha-dupla">
        <div class="campo">
            <label for="nome-usuario">Nome:</label>
            <input type="text" id="nome-usuario" required>
        </div>
        
        <div class="campo">
            <label for="email-usuario">E-mail:</label>
            <input type="email" id="email-usuario" required>
        </div>
    </div>


    <div class="campo">
        <label for="motivo">O que desejas partilhar?</label>
        <select name="motivo" id="motivo">
            <option value="">Seleciona uma opção...</option>
            <option value="projeto">Ideia para um projeto</option>
            <option value="links">Trocar links de repositórios no GitHub</option>
            <option value="ingles">Praticar inglês técnico</option>
        </select>
    </div>

    <div class="campo">
        <label for="mensagem">A tua mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="4"></textarea>
    </div>

    <button type="submit">Enviar Mensagem</button>
</form>
